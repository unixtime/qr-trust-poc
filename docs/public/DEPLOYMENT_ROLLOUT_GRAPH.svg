<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="1120" viewBox="0 0 1460 1120" role="img" aria-labelledby="title desc">
  <title id="title">Deployment rollout graph</title>
  <desc id="desc">Diagram showing stakeholder alignment and why payments, merchant ecosystems, enterprise and institutional deployments, and government services are stronger first deployment slices than broad consumer QR.</desc>
  <defs>
    <style>
      .bg { fill: #f5f1e8; }
      .panel { fill: #fffdf9; stroke: #1d1d1b; stroke-width: 2; }
      .soft { fill: #f7f2ea; stroke: #1d1d1b; stroke-width: 1.5; }
      .accent { fill: #eef3f8; stroke: #365b7a; stroke-width: 2; }
      .warn { fill: #f8dfd9; stroke: #9a3a2a; stroke-width: 2; }
      .ok { fill: #dff0e2; stroke: #2f6f43; stroke-width: 2; }
      .title { font: 700 34px Georgia, "Times New Roman", serif; fill: #181714; }
      .subtitle { font: 400 18px Georgia, "Times New Roman", serif; fill: #4d4a43; }
      .h { font: 700 18px Arial, Helvetica, sans-serif; fill: #181714; }
      .label { font: 600 13px Arial, Helvetica, sans-serif; letter-spacing: 1.2px; fill: #6a655c; text-transform: uppercase; }
      .body { font: 15px Arial, Helvetica, sans-serif; fill: #23211d; }
      .small { font: 13px Arial, Helvetica, sans-serif; fill: #3c3933; }
      .line { stroke: #1d1d1b; stroke-width: 2.5; fill: none; }
      .line-soft { stroke: #6a655c; stroke-width: 2; fill: none; stroke-dasharray: 7 7; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d1d1b"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1460" height="1120"/>

  <text class="title" x="70" y="72">Deployment Rollout and Stakeholder Alignment</text>
  <text class="subtitle" x="70" y="104">The strongest early markets are the ones that already own fraud, enrollment, destinations, or meaningful scanner influence.</text>

  <rect class="panel" x="70" y="240" width="250" height="170" rx="20"/>
  <text class="label" x="95" y="275">Starting problem</text>
  <text class="h" x="95" y="310">Generic QR trust gap</text>
  <text class="body" x="95" y="345">Who owns issuer trust?</text>
  <text class="body" x="95" y="373">Who owns runtime safety?</text>
  <text class="body" x="95" y="401">Who controls scanner UX?</text>

  <rect class="accent" x="360" y="120" width="290" height="120" rx="18"/>
  <text class="label" x="385" y="152">Primary operators</text>
  <text class="h" x="385" y="187">Payments</text>
  <text class="small" x="385" y="218">High fraud cost. Strong incentive.</text>

  <rect class="accent" x="360" y="270" width="290" height="120" rx="18"/>
  <text class="label" x="385" y="302">Primary operators</text>
  <text class="h" x="385" y="337">Merchant ecosystems</text>
  <text class="small" x="385" y="368">Stable destinations. Managed dashboards.</text>

  <rect class="accent" x="360" y="420" width="290" height="120" rx="18"/>
  <text class="label" x="385" y="452">Primary operators</text>
  <text class="h" x="385" y="487">Enterprise and institutional operators</text>
  <text class="small" x="385" y="518">Internal workflows. Organizational destinations.</text>

  <rect class="accent" x="360" y="570" width="290" height="120" rx="18"/>
  <text class="label" x="385" y="602">Primary operators</text>
  <text class="h" x="385" y="637">Government and public services</text>
  <text class="small" x="385" y="668">High trust requirement. Public legitimacy.</text>

  <rect class="ok" x="1060" y="130" width="330" height="300" rx="22"/>
  <text class="label" x="1085" y="165">Best first deployment slices</text>
  <text class="h" x="1085" y="200">Strong incentive alignment</text>
  <text class="body" x="1085" y="240">1. Payments and payment requests</text>
  <text class="body" x="1085" y="275">2. Merchant ecosystems</text>
  <text class="body" x="1085" y="310">3. Enterprise and institutional QR</text>
  <text class="body" x="1085" y="345">4. Government/public services</text>
  <text class="small" x="1085" y="385">These environments already tolerate</text>
  <text class="small" x="1085" y="407">issuer onboarding and destination policy.</text>

  <rect class="soft" x="1060" y="490" width="330" height="190" rx="22"/>
  <text class="label" x="1085" y="525">Secondary rollout slice</text>
  <text class="h" x="1085" y="560">Institutional QR deployments</text>
  <text class="body" x="1085" y="595">• known destinations</text>
  <text class="body" x="1085" y="625">• operator policy exists</text>
  <text class="small" x="1085" y="665">Stronger than open consumer QR, but still</text>
  <text class="small" x="1085" y="687">platform-dependent for scanner behavior.</text>

  <rect class="warn" x="1060" y="735" width="330" height="210" rx="22"/>
  <text class="label" x="1085" y="770">Weak first market</text>
  <text class="h" x="1085" y="805">Open public consumer QR</text>
  <text class="body" x="1085" y="843">• low operator control</text>
  <text class="body" x="1085" y="873">• high privacy resistance</text>
  <text class="body" x="1085" y="903">• no clear paying operator</text>
  <text class="body" x="1085" y="933">• adoption depends on platforms</text>

  <rect class="soft" x="360" y="760" width="300" height="140" rx="18"/>
  <text class="label" x="385" y="792">Secondary operator</text>
  <text class="h" x="385" y="827">Cybersecurity vendors</text>
  <text class="body" x="385" y="862">Best fit: runtime safety signals,</text>
  <text class="body" x="385" y="892">redirect analysis, reputation, malware.</text>

  <rect class="soft" x="710" y="760" width="300" height="140" rx="18"/>
  <text class="label" x="735" y="792">Control point</text>
  <text class="h" x="735" y="827">OS and browser vendors</text>
  <text class="body" x="735" y="862">They control default scanner UX</text>
  <text class="body" x="735" y="892">and mass-market trust display.</text>

  <rect class="panel" x="70" y="970" width="1320" height="120" rx="20"/>
  <text class="label" x="95" y="1005">Strategic implication</text>
  <text class="h" x="95" y="1040">The first viable deployment is not “all QR codes on earth.”</text>
  <text class="body" x="95" y="1070">It is the subset of ecosystems that already own enrollment, fraud cost, destination control, or meaningful influence over scanner behavior.</text>

  <path class="line" d="M320 325 C340 325, 345 180, 360 180" marker-end="url(#arrow)"/>
  <path class="line" d="M320 325 C345 325, 345 330, 360 330" marker-end="url(#arrow)"/>
  <path class="line" d="M320 325 C345 325, 345 480, 360 480" marker-end="url(#arrow)"/>
  <path class="line" d="M320 325 C345 325, 345 630, 360 630" marker-end="url(#arrow)"/>

  <path class="line" d="M650 180 C820 180, 885 215, 1060 215" marker-end="url(#arrow)"/>
  <path class="line" d="M650 330 C825 330, 890 275, 1060 275" marker-end="url(#arrow)"/>
  <path class="line" d="M650 480 C835 480, 905 335, 1060 335" marker-end="url(#arrow)"/>
  <path class="line" d="M650 630 C845 630, 915 395, 1060 395" marker-end="url(#arrow)"/>

  <path class="line-soft" d="M660 830 C830 830, 900 245, 1060 245" marker-end="url(#arrow)"/>
  <path class="line-soft" d="M1010 830 C1040 830, 1045 305, 1060 305" marker-end="url(#arrow)"/>
  <path class="line-soft" d="M1010 850 C1035 850, 1040 585, 1060 585" marker-end="url(#arrow)"/>
  <path class="line-soft" d="M650 480 C840 480, 905 620, 1060 620" marker-end="url(#arrow)"/>
  <path class="line-soft" d="M650 630 C850 630, 915 650, 1060 650" marker-end="url(#arrow)"/>
  <path class="line-soft" d="M1225 680 C1225 705, 1225 710, 1225 735" marker-end="url(#arrow)"/>
</svg>
