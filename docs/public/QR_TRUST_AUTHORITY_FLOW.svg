<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="2240" viewBox="0 0 1500 2240" role="img" aria-labelledby="title desc">
  <title id="title">Governance and validation flow for QR trust</title>
  <desc id="desc">Three-part QR trust figure showing governance and delegation from a root trust program into delegated authorities and issuer enrollment, publication of signed policy and status artifacts, and synchronization plus validation where cached trust state and the signed QR artifact jointly inform the verifier decision path.</desc>
  <defs>
    <style>
      .bg { fill: #f5f1e8; }
      .panel { fill: #fffdf9; stroke: #1d1d1b; stroke-width: 2; }
      .soft { fill: #f7f2ea; stroke: #1d1d1b; stroke-width: 1.5; }
      .accent { fill: #eef3f8; stroke: #365b7a; stroke-width: 2; }
      .tag { fill: #ececeb; stroke: none; }
      .title { font: 700 34px Georgia, "Times New Roman", serif; fill: #181714; }
      .section { font: 700 19px Arial, Helvetica, sans-serif; fill: #181714; }
      .h { font: 700 18px Arial, Helvetica, sans-serif; fill: #181714; }
      .body { font: 15px Arial, Helvetica, sans-serif; fill: #23211d; }
      .small { font: 13px Arial, Helvetica, sans-serif; fill: #3c3933; }
      .tagtext { font: 600 13px Arial, Helvetica, sans-serif; fill: #4d4a43; }
      .line { stroke: #1d1d1b; stroke-width: 2.5; fill: none; }
      .rule { stroke: #455160; stroke-width: 2; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d1d1b"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1500" height="2240"/>

  <text class="title" x="70" y="72">Governance and Validation Flow for QR Trust</text>

  <text class="section" x="70" y="136">Governance / delegation</text>
  <line class="rule" x1="70" y1="155" x2="1430" y2="155"/>

  <rect class="panel" x="525" y="215" width="450" height="150" rx="22"/>
  <text class="h" x="560" y="260">Root trust program</text>
  <text class="body" x="560" y="294">- root keys</text>
  <text class="body" x="560" y="324">- accreditation rules</text>
  <text class="body" x="560" y="354">- delegation policy</text>

  <rect class="accent" x="115" y="440" width="315" height="138" rx="18"/>
  <text class="h" x="150" y="502">Payment operator</text>

  <rect class="accent" x="575" y="440" width="390" height="138" rx="18"/>
  <text class="h" x="600" y="502">Government / public-service operator</text>

  <rect class="accent" x="1100" y="440" width="335" height="138" rx="18"/>
  <text class="h" x="1128" y="502">Merchant / enterprise operator</text>

  <path class="line" d="M750 365 L750 405 L272 405 L272 422" marker-end="url(#arrow)"/>
  <path class="line" d="M750 365 L750 422" marker-end="url(#arrow)"/>
  <path class="line" d="M750 365 L750 405 L1262 405 L1262 422" marker-end="url(#arrow)"/>

  <rect class="tag" x="150" y="390" width="90" height="30" rx="8"/>
  <text class="tagtext" x="169" y="410">delegates</text>
  <rect class="tag" x="830" y="378" width="90" height="30" rx="8"/>
  <text class="tagtext" x="849" y="398">delegates</text>
  <rect class="tag" x="1300" y="390" width="90" height="30" rx="8"/>
  <text class="tagtext" x="1319" y="410">delegates</text>

  <rect class="soft" x="182" y="422" width="180" height="34" rx="8"/>
  <text class="tagtext" x="214" y="444">Delegated authority</text>
  <rect class="soft" x="675" y="422" width="180" height="34" rx="8"/>
  <text class="tagtext" x="707" y="444">Delegated authority</text>
  <rect class="soft" x="1172" y="422" width="180" height="34" rx="8"/>
  <text class="tagtext" x="1204" y="444">Delegated authority</text>

  <path class="line" d="M272 578 L272 625 L610 625 L610 720" marker-end="url(#arrow)"/>
  <path class="line" d="M767 578 L767 720" marker-end="url(#arrow)"/>
  <path class="line" d="M1262 578 L1262 625 L920 625 L920 720" marker-end="url(#arrow)"/>

  <rect class="tag" x="620" y="650" width="260" height="36" rx="8"/>
  <text class="tagtext" x="652" y="674">issuer enrollment and governance</text>

  <rect class="soft" x="585" y="720" width="365" height="190" rx="18"/>
  <text class="h" x="620" y="762">Enrolled issuer node</text>
  <text class="body" x="620" y="796">- issuer identifier</text>
  <text class="body" x="620" y="826">- assurance tier</text>
  <text class="body" x="620" y="856">- key refs</text>
  <text class="body" x="620" y="886">- approved domains / resolvers / app</text>

  <path class="line" d="M767 910 L767 1010" marker-end="url(#arrow)"/>
  <rect class="tag" x="715" y="944" width="100" height="30" rx="8"/>
  <text class="tagtext" x="744" y="964">issues</text>

  <rect class="soft" x="575" y="1010" width="385" height="165" rx="18"/>
  <text class="h" x="610" y="1068">Signed QR artifact</text>
  <text class="body" x="610" y="1110">- issuer reference</text>
  <text class="body" x="610" y="1145">- destination / resolver claims</text>

  <text class="section" x="70" y="1260">Shared state publication</text>
  <line class="rule" x1="70" y1="1279" x2="1430" y2="1279"/>

  <rect class="accent" x="130" y="1340" width="240" height="68" rx="12"/>
  <text class="h" x="152" y="1383">Root trust program</text>

  <rect class="accent" x="130" y="1440" width="240" height="68" rx="12"/>
  <text class="h" x="152" y="1483">Delegated operators</text>

  <path class="line" d="M370 1374 L500 1374" marker-end="url(#arrow)"/>
  <path class="line" d="M370 1474 L500 1474" marker-end="url(#arrow)"/>

  <rect class="tag" x="392" y="1359" width="86" height="30" rx="8"/>
  <text class="tagtext" x="404" y="1379">publishes</text>
  <rect class="tag" x="392" y="1459" width="86" height="30" rx="8"/>
  <text class="tagtext" x="404" y="1479">publishes</text>

  <rect class="panel" x="500" y="1325" width="495" height="198" rx="18"/>
  <text class="h" x="535" y="1362">Signed policy and status artifacts</text>
  <text class="body" x="535" y="1396">- delegation manifests</text>
  <text class="body" x="535" y="1426">- issuer manifests</text>
  <text class="body" x="535" y="1456">- destination policy updates</text>
  <text class="body" x="535" y="1486">- revocation / suspension events</text>
  <text class="body" x="535" y="1516">- freshness metadata</text>

  <text class="small" x="1080" y="1355">How one entity's knowledge reaches another:</text>
  <text class="small" x="1080" y="1376">signed policy, status, and freshness artifacts.</text>

  <text class="section" x="70" y="1625">State synchronization and validation</text>
  <line class="rule" x1="70" y1="1644" x2="1430" y2="1644"/>

  <rect class="accent" x="130" y="1705" width="240" height="68" rx="12"/>
  <text class="h" x="155" y="1734">Signed policy and</text>
  <text class="h" x="155" y="1758">status artifacts</text>

  <path class="line" d="M370 1739 L610 1739" marker-end="url(#arrow)"/>

  <rect class="tag" x="440" y="1724" width="100" height="30" rx="8"/>
  <text class="tagtext" x="450" y="1744">sync / cache</text>

  <rect class="panel" x="610" y="1688" width="380" height="184" rx="18"/>
  <text class="h" x="645" y="1726">Scanner / verifier cache</text>
  <text class="body" x="645" y="1758">- root / operator state</text>
  <text class="body" x="645" y="1788">- issuer state</text>
  <text class="body" x="645" y="1818">- destination policy state</text>
  <text class="body" x="645" y="1848">- revocation / freshness state</text>

  <path class="line" d="M800 1872 L800 1946" marker-end="url(#arrow)"/>

  <rect class="tag" x="720" y="1894" width="160" height="30" rx="8"/>
  <text class="tagtext" x="738" y="1914">provides current state</text>

  <rect class="accent" x="130" y="1968" width="220" height="68" rx="12"/>
  <text class="h" x="165" y="2011">Signed QR artifact</text>

  <path class="line" d="M350 2002 L610 2002" marker-end="url(#arrow)"/>

  <rect class="panel" x="610" y="1946" width="535" height="235" rx="18"/>
  <text class="h" x="645" y="1990">Verifier decision path</text>
  <text class="body" x="645" y="2030">1. validate root → authority → issuer chain</text>
  <text class="body" x="645" y="2064">2. validate issuer status / tier</text>
  <text class="body" x="645" y="2098">3. validate current destination / resolver policy</text>
  <text class="body" x="645" y="2132">4. check runtime safety freshness or query</text>
  <text class="body" x="645" y="2166">5. apply local policy and emit trust state</text>
</svg>
