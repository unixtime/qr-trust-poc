name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release-audit:
    name: Release Audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install audit tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils ripgrep file

      - name: Run public release audit
        # The audit's `auto` role detection keys on release/export_public_repo.sh,
        # which is tracked here, so a CI clone of this repo reads as a maintainer
        # workspace. It is not one: the maintainer scans need
        # local/release_audit_private_patterns.txt and network/node_modules, and
        # neither is in git, so four checks fail on any runner. CI is the public
        # role the script documents. This job had never actually run -- the
        # workflow fires only on pull_request and push to main, and this repo's
        # remote is GitLab -- so the breakage surfaced the moment .gitlab-ci.yml
        # gave the audit a runner for the first time.
        env:
          RELEASE_AUDIT_ROLE: public
        run: make release-audit

  release-readiness-report:
    name: Release Readiness Report
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: network/package-lock.json

      - name: Install audit tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils ripgrep file

      - name: Install network dependencies
        working-directory: network
        run: npm ci

      - name: Check release readiness report
        run: make check-release-readiness-report

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Audit frontend production dependencies (zero tolerance)
        working-directory: frontend
        run: npm audit --omit=dev

      - name: Audit frontend full tree (no high or critical)
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Audit network full tree (no high or critical)
        working-directory: network
        run: npm audit --audit-level=high

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      # No `uv sync` step: the scanners come from uvx at pinned versions and
      # none of backend's own dependencies are imported. The version pins and
      # scan scopes live in the Makefile; every threshold lives in
      # scripts/security_audit.py, which is stdlib-only.

      # bandit over backend/app and scripts. The scope is explicit because the
      # repo carries stale copies of these files under local/public_export and
      # site/backend, and a repo-root scan would report findings against code
      # nothing builds. The gate also asserts a line-count floor, so a renamed
      # path fails loudly instead of scanning nothing and exiting 0.
      - name: Run bandit over the Python backend and scripts
        run: make security-audit-python

      # uv export flattens the lockfile to a hash-pinned requirements file, so
      # what is audited is exactly what `uv sync --frozen` installs rather than
      # whatever a local .venv happens to hold.
      - name: Audit backend dependencies for known advisories
        run: make security-audit-deps

      # semgrep runs with --error because it otherwise exits 0 even with
      # blocking findings. Suppressions are inline `# nosemgrep` markers that
      # name their rule id, so each one is readable beside the code it excuses.
      - name: Run semgrep over the backend, scripts, frontend, and network
        run: make security-audit-semgrep

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # pngquant and libcairo2 are for `make docs-build` below, not the tests:
      # mkdocs-material's optimize plugin shells out to the pngquant binary,
      # and the social plugin's cairosvg resolves libcairo through ctypes. uv
      # can supply neither — one is not a Python package, the other is a
      # native library. Under `mkdocs build --strict` a missing pngquant is a
      # hard error, so the job fails before it ever reaches pytest.
      - name: Install ripgrep and documentation build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep pngquant libcairo2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Build documentation and verify Mermaid rendering
        run: make docs-build

      - name: Run backend tests
        working-directory: backend
        run: PYTHONPATH=.. ./.venv/bin/pytest

  frontend-build:
    name: Frontend Lint And Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Check frontend trust-row colour mapping
        working-directory: frontend
        run: npm run trust-tone:smoke

  verifier-lab-stability:
    name: Verifier Lab Stability Checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # Umbrella target: runs the verifier and lab pytest slice, then chains
      # check-frontend-vite-config, check-frontend-trust-tone,
      # check-frontend-scanner-contract, check-frontend-scanner-open-contract
      # and check-ios-scanner-open-contract. Targets added to that chain
      # are covered here without editing this workflow.
      - name: Run verifier lab stability checks
        run: make check-python-verifier-lab-stability

  compose-workbench-smoke:
    name: Compose Workbench Smoke
    runs-on: ubuntu-latest
    env:
      VERIFIER_ADMIN_TOKENS: '["local-lab-admin"]'
      VERIFIER_BOOTSTRAP_ADMIN_TOKENS_ENABLED: "true"
      VERIFIER_SMOKE_ADMIN_TOKEN: local-lab-admin
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Start compose stack
        run: docker compose up -d --build --wait

      - name: Run compose workbench smoke
        run: make smoke-compose

      - name: Capture compose logs on failure
        if: failure()
        run: docker compose logs --no-color > /tmp/qrcode-poc-compose.log

      - name: Upload compose logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-workbench-smoke-logs
          path: /tmp/qrcode-poc-compose.log

      - name: Stop compose stack
        if: always()
        run: docker compose down -v

  network-services-offline:
    name: Reference Network Offline Suite
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: network/package-lock.json

      - name: Install reference network dependencies
        working-directory: network
        run: npm ci

      # scripts/network_services_check.sh splits the reference-network suite by
      # what infrastructure it needs. `offline` is the 57 scripts that need
      # none; the one it holds back, scanner-decision:http-runtime-smoke, needs
      # a live HTTP service. "Offline" here means "does not need the HTTP
      # runtime" and is easy to misread, because eight of these are named
      # postgres:* and two nats:* -- but none of them opens a connection. Every
      # Postgres and NATS port has an in-memory double, postgres-driver.ts and
      # nats-js-publisher.ts export factories that nothing invokes at import
      # time, and the variants that do talk to real services are separate make
      # targets that inject QRTRUST_NETWORK_DATABASE_URL explicitly. This job
      # needs no services.
      #
      # Worth more than its 30s: the suite opens with `tsc --noEmit` over the
      # whole network package, which nothing else here type-checks.
      - name: Run reference network offline suite
        run: make check-network-services-offline

  static-fixture-checks:
    name: Static Fixture And Artifact Checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Check governance fixtures
        run: make check-governance-fixtures

      - name: Check network contracts
        run: make check-network-contracts

      # The only part of the iOS surface that needs no Xcode: pure sh over
      # tracked xcconfig, asserting the committed defaults never embed a local
      # verifier endpoint and never bake QRTRUST_VERIFIER_PROFILE_STATE. The
      # override file it also checks is gitignored, so on a default checkout
      # that branch reports it absent and the check still passes.
      - name: Check iOS provider config
        run: make check-ios-provider-config

      # The slow one, ~5s: replays the trust-residuals corpus and re-derives
      # the formal table over 2.2M sweep comparisons, then asserts the
      # committed docs/public/evaluation/trust_residuals_results.v1.json still
      # matches. It writes no files.
      - name: Check trust residuals evaluation
        run: make check-trust-residuals-evaluation

  route-navigation-smoke:
    name: Route Navigation Smoke
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Install Playwright browser
        working-directory: backend
        run: ./.venv/bin/python -m playwright install --with-deps chromium

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # Venv-only API: no postgres or redis, so the smoke can assert route
      # and query-param behavior but not operator panels backed by the DB.
      - name: Start verifier API
        env:
          REDIS_STARTUP_ENABLED: "false"
          SECRET_KEY: route-navigation-smoke-secret
        run: |
          ./backend/.venv/bin/python -m uvicorn backend.app.main:app \
            --host 127.0.0.1 --port 8000 --log-level warning \
            > /tmp/qrcode-poc-api.log 2>&1 &
          echo "$!" > /tmp/qrcode-poc-api.pid

      - name: Wait for verifier API
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/verifier/status >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/qrcode-poc-api.log
          exit 1

      - name: Start React dev server
        working-directory: frontend
        env:
          VITE_BACKEND_TARGET: http://127.0.0.1:8000
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 > /tmp/qrcode-poc-vite.log 2>&1 &
          echo "$!" > /tmp/qrcode-poc-vite.pid

      - name: Wait for React dev server
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/qrcode-poc-vite.log
          exit 1

      - name: Run route navigation smoke
        run: make check-route-navigation

      - name: Upload Vite log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: route-navigation-vite-log
          path: /tmp/qrcode-poc-vite.log

      - name: Upload API log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: route-navigation-api-log
          path: /tmp/qrcode-poc-api.log

  ios-swift-parse:
    name: iOS Swift Parse
    runs-on: ubuntu-latest
    # The only iOS job a linux runner can host, and the only one GitLab can
    # run at all -- every runner on that instance is linux/amd64. What survives
    # the port is the front half of the compiler: `swiftc -parse` stops before
    # name resolution, so it never looks for SwiftUI or UIKit and needs only a
    # toolchain. It catches syntax that would redden an Xcode build; it does
    # not catch a missing symbol or a type error. The build-ios job below does,
    # but only here, and only after the push.
    #
    # Pinned rather than `swift:latest` so a new compiler cannot start
    # rejecting committed sources without a deliberate bump here.
    container: swift:6.0
    steps:
      # The Swift image is Ubuntu-based and carries the toolchain but not make.
      - name: Install make
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends make

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Swift parse check
        run: |
          swift --version
          make check-ios-swift-parse

  build-ios:
    name: iOS Build
    runs-on: macos-latest
    # The half of the iOS target ios-swift-parse cannot reach: a real compile,
    # so this is what catches a missing symbol, a type error, or a SwiftUI API
    # that moved under the sources.
    #
    # This job has no counterpart in .gitlab-ci.yml and cannot have one. Every
    # runner on that instance is linux/amd64, and xcodebuild exists only on
    # macOS. GitHub-hosted runners are free and unmetered for public
    # repositories, so the macOS runner this needs costs nothing -- but it is
    # reachable only from the published tree, which means iOS is the one
    # surface the review mirror cannot gate ahead of the push.
    #
    # Not pinned, unlike ios-swift-parse's swift:6.0 container. The reasoning
    # there -- a new compiler must not start rejecting committed sources
    # without a deliberate bump -- applies just as well to Xcode, but GitHub
    # retires macOS image labels outright, so a pin eventually stops
    # scheduling rather than failing loudly. Drift is the cheaper failure.
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show toolchain
        run: xcodebuild -version

      # make build-ios targets the simulator SDK with CODE_SIGNING_ALLOWED=NO,
      # so it needs no development team, certificate, or provisioning profile
      # -- nothing here holds signing credentials, and nothing here should.
      - name: Build iOS app
        run: make build-ios
