<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verifier QR Display</title>
    <style>
      :root {
        --paper: #f5f0e7;
        --ink: #1e2a24;
        --muted: #5c665f;
        --panel: rgba(255, 252, 246, 0.92);
        --line: rgba(30, 42, 36, 0.12);
        --accent: #0e5a4f;
        --accent-strong: #083d36;
        --shadow: 0 24px 80px rgba(30, 42, 36, 0.12);
      }

      body.high-contrast {
        --paper: #0b0d0c;
        --ink: #f4f7f5;
        --muted: rgba(244, 247, 245, 0.78);
        --panel: rgba(10, 12, 11, 0.96);
        --line: rgba(244, 247, 245, 0.14);
        --accent: #f4f7f5;
        --accent-strong: #ffffff;
        --shadow: 0 18px 40px rgba(0, 0, 0, 0.5);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--ink);
        background:
          radial-gradient(circle at top left, rgba(14, 90, 79, 0.14), transparent 28%),
          linear-gradient(135deg, #efe8db 0%, #f8f5ef 42%, #ece4d6 100%);
        font-family: "Avenir Next", "Segoe UI", sans-serif;
      }

      main {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .shell {
        width: min(100%, 980px);
        display: grid;
        gap: 20px;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        box-shadow: var(--shadow);
        padding: 24px;
      }

      h1 {
        margin: 0 0 10px;
        font-family: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, serif;
        font-size: clamp(2.2rem, 4vw, 3.6rem);
        line-height: 0.95;
        letter-spacing: -0.04em;
      }

      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.6;
      }

      .grid {
        display: grid;
        grid-template-columns: minmax(320px, 1fr) minmax(260px, 360px);
        gap: 20px;
        align-items: start;
      }

      .qr-frame {
        display: grid;
        place-items: center;
        min-height: 72vh;
        background: #fff;
        border: 1px solid var(--line);
        padding: 28px;
      }

      body.high-contrast .qr-frame {
        background: #fff;
        border-color: rgba(255, 255, 255, 0.2);
      }

      .qr-frame img {
        width: min(100%, 72vh);
        aspect-ratio: 1;
        object-fit: contain;
      }

      .meta {
        display: grid;
        gap: 14px;
      }

      body.clean-display .panel:first-child,
      body.clean-display .meta {
        display: none;
      }

      body.clean-display .shell {
        width: min(100%, 1100px);
      }

      body.clean-display .panel {
        padding: 0;
        border: 0;
        box-shadow: none;
        background: transparent;
      }

      body.clean-display .qr-frame {
        min-height: calc(100vh - 48px);
        padding: 16px;
      }

      .meta-item {
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.66);
        padding: 14px 16px;
      }

      .meta-item strong {
        display: block;
        font-size: 0.76rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--accent-strong);
        margin-bottom: 6px;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }

      a,
      button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 18px;
        border: 1px solid rgba(30, 42, 36, 0.18);
        padding: 14px 16px;
        background: rgba(255, 255, 255, 0.72);
        color: var(--ink);
        text-decoration: none;
        font-size: 0.96rem;
        cursor: pointer;
      }

      button.primary {
        background: var(--accent);
        color: #f7f4ef;
        border-color: transparent;
      }

      body.high-contrast button.primary {
        color: #0b0d0c;
      }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 16px;
      }

      .empty {
        text-align: center;
        display: grid;
        gap: 14px;
        place-items: center;
        min-height: 40vh;
      }

      code {
        font-family: "SFMono-Regular", Menlo, monospace;
      }

      @media (max-width: 900px) {
        .grid {
          grid-template-columns: 1fr;
        }

        .qr-frame {
          min-height: auto;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="shell">
        <section class="panel">
          <h1>Second-screen QR display</h1>
          <p>
            Use this page on one device and point the other device's verifier lab
            camera at it. This page is only a display target. It does not verify
            the QR by itself.
          </p>
          <div class="toolbar">
            <button id="toggle-contrast-button" class="primary" type="button">Enable high-contrast mode</button>
            <button id="toggle-clean-display-button" type="button">Hide metadata</button>
            <button id="toggle-fullscreen-button" type="button">Enter fullscreen</button>
          </div>
        </section>

        <section class="panel">
          <div id="content" class="empty">
            <strong>No QR is loaded yet.</strong>
            <p>Go back to the verifier lab, generate a QR, then open this page again.</p>
            <div class="actions">
              <a href="/verifier/lab">Back to verifier lab</a>
            </div>
          </div>
        </section>
      </div>
    </main>

    <script>
      const storageKey = "verifier-lab-fullscreen-qr";
      const content = document.getElementById("content");
      const contrastButton = document.getElementById("toggle-contrast-button");
      const cleanDisplayButton = document.getElementById("toggle-clean-display-button");
      const fullscreenButton = document.getElementById("toggle-fullscreen-button");

      function readState() {
        const raw = window.localStorage.getItem(storageKey);
        if (!raw) return null;
        try {
          return JSON.parse(raw);
        } catch {
          return null;
        }
      }

      function renderEmpty() {
        content.className = "empty";
        content.replaceChildren();
        const title = document.createElement("strong");
        title.textContent = "No QR is loaded yet.";
        const detail = document.createElement("p");
        detail.textContent = "Go back to the verifier lab, generate a QR, then open this page again.";
        const actions = document.createElement("div");
        actions.className = "actions";
        const link = document.createElement("a");
        link.href = "/verifier/lab";
        link.textContent = "Back to verifier lab";
        actions.append(link);
        content.append(title, detail, actions);
      }

      function renderState(state) {
        content.className = "grid";
        content.replaceChildren();

        const qrFrame = document.createElement("div");
        qrFrame.className = "qr-frame";
        const image = document.createElement("img");
        image.alt = "Fullscreen verifier QR";
        image.src = `data:image/png;base64,${state.qrPngBase64}`;
        qrFrame.append(image);

        const meta = document.createElement("div");
        meta.className = "meta";

        const metaRows = [
          ["Scenario", state.scenario || "Unknown"],
          ["Nonce", state.nonce || "Unknown"],
          ["Payload", state.payload || "Unknown"],
          ["Instruction", "Use another device's verifier lab camera to scan this QR."],
        ];

        metaRows.forEach(([label, value]) => {
          const item = document.createElement("div");
          item.className = "meta-item";
          const heading = document.createElement("strong");
          heading.textContent = label;
          const body = document.createElement(label === "Payload" ? "code" : "div");
          body.textContent = value;
          item.append(heading, body);
          meta.append(item);
        });

        const actions = document.createElement("div");
        actions.className = "actions";

        const refreshButton = document.createElement("button");
        refreshButton.className = "primary";
        refreshButton.textContent = "Reload current QR";
        refreshButton.addEventListener("click", () => {
          const latest = readState();
          if (!latest) {
            renderEmpty();
            return;
          }
          renderState(latest);
        });

        const backLink = document.createElement("a");
        backLink.href = "/verifier/lab";
        backLink.textContent = "Back to verifier lab";

        actions.append(refreshButton, backLink);
        meta.append(actions);

        content.append(qrFrame, meta);
      }

      function syncModeButtons() {
        const highContrast = document.body.classList.contains("high-contrast");
        const cleanDisplay = document.body.classList.contains("clean-display");
        contrastButton.textContent = highContrast ? "Disable high-contrast mode" : "Enable high-contrast mode";
        cleanDisplayButton.textContent = cleanDisplay ? "Show metadata" : "Hide metadata";
        fullscreenButton.textContent = document.fullscreenElement ? "Exit fullscreen" : "Enter fullscreen";
      }

      const initialState = readState();
      if (initialState) {
        renderState(initialState);
      } else {
        renderEmpty();
      }
      syncModeButtons();

      window.addEventListener("storage", (event) => {
        if (event.key !== storageKey) return;
        const latest = readState();
        if (latest) {
          renderState(latest);
        } else {
          renderEmpty();
        }
      });

      contrastButton.addEventListener("click", () => {
        document.body.classList.toggle("high-contrast");
        syncModeButtons();
      });

      cleanDisplayButton.addEventListener("click", () => {
        document.body.classList.toggle("clean-display");
        syncModeButtons();
      });

      fullscreenButton.addEventListener("click", async () => {
        try {
          if (document.fullscreenElement) {
            await document.exitFullscreen();
          } else {
            await document.documentElement.requestFullscreen();
          }
        } catch {
          // Ignore fullscreen failures and keep the page usable.
        }
        syncModeButtons();
      });

      document.addEventListener("fullscreenchange", syncModeButtons);
    </script>
  </body>
</html>
