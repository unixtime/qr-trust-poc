site_name: QR Trust PoC
site_description: Reference documentation for navigation QR trust decisions
# Canonical base for the deployed docs; the social plugin needs it to emit
# absolute og:image URLs, and MkDocs uses it for canonical links + sitemap.
site_url: https://qrtrust.unixtime.com/docs/
docs_dir: docs
site_dir: site
use_directory_urls: true

theme:
  name: material
  # Brand mark + favicon, shared with the qrtrust.unixtime.com landing page.
  logo: public/assets/images/logo.svg
  favicon: public/assets/images/favicon.svg
  palette:
    scheme: slate
  features:
    - navigation.top
    - navigation.sections
    - content.code.copy
    - search.highlight

hooks:
  - backend/scripts/mkdocs_source_pages.py

plugins:
  - search
  - mermaid2:
      # Pin the renderer via an explicit UMD .js URL: the plugin then emits a
      # <script src=...> tag (instead of an inline ESM import), which the
      # privacy plugin can rewrite to a self-hosted copy. Only pages with
      # diagrams get the tag.
      javascript: https://unpkg.com/mermaid@11.16.0/dist/mermaid.min.js
      arguments:
        securityLevel: strict
  # Generate og-preview card images so docs deep links unfurl with a real
  # preview. Build needs Pillow + CairoSVG (mkdocs-material[imaging]).
  # The default layout picks up theme.logo; colors match the landing brand.
  - social:
      cards_layout_options:
        background_color: "#081018"
        color: "#FFFFFF"
  # Recompress the served copies of PNG/JPG media at build time (pngquant +
  # Pillow). Checked-in originals are untouched; only site output shrinks.
  - optimize
  # Keep privacy last so it rewrites the final HTML: it downloads every
  # external asset (mermaid's unpkg script, theme fonts) into the site
  # output, leaving zero third-party requests in served pages.
  - privacy

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - fenced_code
  - tables
  - toc:
      permalink: true

extra_css:
  # ?v= busts the Cloudflare CDN cache (keyed on full URL, 4h TTL for .css);
  # bump the number whenever either stylesheet changes.
  - public/assets/stylesheets/diagram-explorer.css?v=2
  - public/assets/stylesheets/qrtrust-theme.css?v=2

extra_javascript:
  - public/assets/javascripts/diagram-explorer.js

validation:
  nav:
    omitted_files: ignore
    not_found: warn
    absolute_links: info
  links:
    # Repo-relative links to source, policies, and CITATION.cff legitimately
    # leave docs_dir. The release exporter validates those links against the
    # complete public tree; MkDocs can only validate targets under docs/.
    not_found: info
    anchors: warn
    absolute_links: relative_to_docs
    unrecognized_links: info

nav:
  - Home: README.md
  - Project:
      - Overview: public/PROJECT_OVERVIEW.md
      - Quishing threat evidence: public/QUISHING_THREAT_EVIDENCE.md
      - Run guide: public/RUN_GUIDE.md
      - Citing this work: public/CITING.md
      - Open-source direction: public/OPEN_SOURCE_DIRECTION.md
  - Decision model:
      - Trust model: public/TRUST_MODEL.md
      - Trust-residual decision semantics: public/TRUST_RESIDUALS_DECISION_SEMANTICS.md
      - Trust-model graph: public/TRUST_MODEL_GRAPH.md
      - Trust layers: public/TRUST_LAYERS.md
      - Trust tiers: public/TRUST_TIERS.md
      - Verifier profile: public/VERIFIER_PROFILE.md
      - Scanner decision matrix: public/SCANNER_DECISION_MATRIX.md
      - Scanner UX states: public/SCANNER_UX_STATES.md
      - Security requirements: public/QR_TRUST_SECURITY_REQUIREMENTS.md
      - Enrollment and consent: public/ENROLLMENT_AND_CONSENT_MODEL.md
      - Short URL and redirect policy: public/SHORT_URL_REDIRECT_POLICY.md
      - Failure modes: public/TRUST_MODEL_FAILURE_MODES.md
  - Evaluation:
      - Evaluation guide: public/evaluation/README.md
      - Evaluation results: public/evaluation/trust_residuals_results.v1.md
      - Test vectors: public/TEST_VECTORS.md
      - Browser and device matrix: public/BROWSER_TEST_MATRIX.md
      - Evidence manifest: public/evidence/README.md
  - Architecture:
      - Network architecture: public/NETWORK_ARCHITECTURE_PLAN.md
      - Network contracts: public/network-contracts/README.md
      - Governance artifacts: public/APPENDIX_GOVERNANCE_ARTIFACTS.md
      - iOS app design: public/IOS_END_USER_APP_DESIGN.md
      - iOS enterprise readiness: public/IOS_ENTERPRISE_READINESS.md
  - Operations:
      - Public release checklist: public/PUBLIC_RELEASE_CHECKLIST.md
      - Release-candidate status: public/RELEASE_CANDIDATE_STATUS.md

